spring.profiles.active=local

spring.application.name=backend
logging.level.root=info

spring.config.import=optional:classpath:secret-application.properties,classpath:application-local-holday.yml

# 종목 정보 및 차트 데이터 동기화 Runner Flag
candle.sync-setup=false

#키움 REST API KEY
#kiwoom.base-url=https://mockapi.kiwoom.com
kiwoom.base-url=https://api.kiwoom.com

# 키움 실시간 시세 Base
#WS: 주식 체결(0B)
#시계열 데이터 공통화
spring.mvc.format.date-time= yyyyMMddHHmmss

# 실시간 REST 차트 수집 활성화
kiwoom.candle.realtime.enabled=true
# DB에 등록된 종목 코드 1~10개를 쉼표로 지정
kiwoom.candle.realtime.stock-codes=005930
# 전체 대상 종목의 봉별 갱신 목표 간격
kiwoom.candle.realtime.refresh.minute-1=4s
kiwoom.candle.realtime.refresh.minute-5=12s
kiwoom.candle.realtime.refresh.minute-15=24s
kiwoom.candle.realtime.refresh.minute-30=36s
kiwoom.candle.realtime.refresh.minute-60=60s
kiwoom.candle.realtime.refresh.day=30s
kiwoom.candle.realtime.refresh.week=60s
kiwoom.candle.realtime.refresh.month=120s
kiwoom.candle.realtime.refresh.year=300s
kiwoom.candle.realtime.db-threads=2
kiwoom.candle.realtime.db-queue-capacity=30
# 휴장일은 거래소 일정에 맞춰 별도 지정
# kiwoom.candle.realtime.holidays=2026-12-25

#DB
spring.datasource.url=jdbc:postgresql://localhost:5432/trady
spring.jpa.hibernate.ddl-auto=update


#logging.level.org.hibernate.SQL=DEBUG
