spring.profiles.active=local

spring.application.name=backend
logging.level.root=info
spring.config.import=optional:classpath:secret-application.properties

#키움 REST API KEY
kiwoom.base-url=https://mockapi.kiwoom.com

#시계열 데이터 공통화
spring.mvc.format.date-time= yyyyMMddHHmmss

# 종목 정보 및 차트 데이터 동기화 Runner Flag
candle.sync-setup=false

#DB
spring.datasource.url=jdbc:postgresql://localhost:5432/trady
spring.jpa.hibernate.ddl-auto=validate


